name: Build IPA

# Builds Madeira.app and packages it as an unsigned .ipa for sideloading.
#
# Read ci/README.md before the first run. Two things will stop a cold run:
#   1. toolchains/ must exist — run the "Build toolchains" workflow once first.
#   2. A base app/Madeira/libwineserver.a must be supplied (repo variable
#      WINESERVER_BASE_URL, or a file at ci/prebuilt/libwineserver.a).
#      build/wineserver/build.sh patches an existing archive; it cannot
#      create one, and the base is gitignored upstream.
#
# The result is deliberately unsigned. Madeira needs the JIT / increased
# memory / extended-VA entitlements and a debugger attach, so it can never go
# through the App Store — it is re-signed with your own Apple ID and installed
# by a sideloader.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        options: [Release, Debug]
        default: Release
      skip_native_libs:
        description: Skip stage 30 (use archives already in the caches)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build/**"
      - "ci/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      XCODE_CONFIG: ${{ inputs.configuration || 'Release' }}
      WINESERVER_BASE_URL: ${{ vars.WINESERVER_BASE_URL }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show Xcode version
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install ninja cmake meson bison flex pkgconf
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin"  >> "$GITHUB_PATH"

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Cache keys track the submodule commits, so a submodule bump
      # invalidates exactly the stage that consumes it.
      - name: Compute cache keys
        id: keys
        run: |
          sub() { git -C "$1" rev-parse HEAD 2>/dev/null || echo none; }
          {
            echo "wine=$(sub wine)"
            echo "fex=$(sub FEX)"
            echo "dxmt=$(sub research/dxmt)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore toolchains
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: toolchains
          key: toolchains-${{ runner.os }}-llvm15.0.7-mingw20260421-v1

      - name: Require toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          echo "::error::No toolchains cache. Run the 'Build toolchains' workflow once, then re-run this." 
          exit 1

      - name: Cache wine/build-macos
        uses: actions/cache@v4
        with:
          path: wine/build-macos
          key: wine-${{ runner.os }}-${{ steps.keys.outputs.wine }}-v1

      - name: Stage 10 — wine
        run: ./ci/10-wine.sh

      - name: Cache FEX/build-ios
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: fex-${{ runner.os }}-${{ steps.keys.outputs.fex }}-v1

      - name: Stage 20 — FEX
        run: ./ci/20-fex.sh

      - name: Stage 30 — native libs + DXMT PE DLLs
        if: ${{ !inputs.skip_native_libs }}
        run: ./ci/30-native-libs.sh

      - name: Stage 40 — xcodebuild + package ipa
        run: ./ci/40-app-ipa.sh

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-${{ env.XCODE_CONFIG }}-${{ github.sha }}
          path: |
            out/Madeira-unsigned.ipa
            out/Madeira.entitlements
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build/*/obj/*.err
            build/*/obj/err-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          {
            echo "### Madeira — unsigned IPA"
            echo
            echo "\`$(du -h out/Madeira-unsigned.ipa | cut -f1 | tr -d ' ')\` · configuration \`${XCODE_CONFIG}\`"
            echo
            echo "Unsigned on purpose. Re-sign with your own Apple ID, then attach"
            echo "StikDebug for JIT. A free Apple ID's profile expires after 7 days."
          } >> "$GITHUB_STEP_SUMMARY"
